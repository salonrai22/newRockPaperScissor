<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <div class="choices">
        <div class="choice" id="paper">
            <img src="paper.png">
        </div>
        <div class="choice" id="stone">
            <img src="stone.png">
        </div>
        <div class="choice" id="scissor">
            <img src="scissor.png">
        </div>
    </div>
    
    <div class="score-box">
        <div class="userScore">
            <p id="user-score">0</p>
            User
        </div>
        
        <div class="compScore">
            <p id="comp-score">0</p>
            Computer
        </div>
        
    </div>

    <div class="result">
         <p class="who" class="green" class="red" class="yellow">Play</p>
    </div>

<script src="script.js"></script>
</body>
</html>
